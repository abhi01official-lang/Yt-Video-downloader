<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free YouTube Video & Audio Downloader</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #121212; 
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px; 
        }
        .card { 
            background: #1e1e1e; 
            padding: 30px; 
            border-radius: 12px; 
            width: 100%; 
            max-width: 520px; 
            text-align: center; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.6); 
        }
        h2 { color: #ff3333; margin-bottom: 20px; font-size: 1.8rem; }
        .input-group { 
            display: flex; 
            gap: 10px; 
            margin-bottom: 15px; 
            flex-direction: column; 
        }
        input[type="text"] { 
            width: 100%; 
            padding: 14px; 
            border-radius: 6px; 
            border: 1px solid #333; 
            background: #2a2a2a; 
            color: #fff; 
            font-size: 1rem; 
            outline: none; 
        }
        input[type="text"]:focus { border-color: #ff3333; }
        button { 
            width: 100%; 
            padding: 14px; 
            background: #ff3333; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-weight: bold; 
            font-size: 1rem; 
            cursor: pointer; 
            transition: 0.2s; 
        }
        button:hover { background: #cc0000; }
        #results { 
            margin-top: 25px; 
            display: none; 
            border-top: 1px solid #333; 
            padding-top: 20px; 
        }
        img { max-width: 100%; border-radius: 8px; margin-bottom: 15px; }
        h3 { font-size: 1.1rem; margin-bottom: 15px; line-height: 1.4; color: #f1f1f1; }
        .section-title { 
            font-size: 0.85rem; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            color: #aaa; 
            margin: 15px 0 10px; 
            text-align: left; 
        }
        .dl-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
        .dl-btn { 
            display: inline-block; 
            padding: 10px 14px; 
            background: #28a745; 
            color: white; 
            text-decoration: none; 
            border-radius: 5px; 
            font-weight: bold; 
            font-size: 0.9rem; 
            transition: 0.2s; 
            border: none;
            cursor: pointer;
        }
        .dl-btn:hover { background: #218838; }
        .dl-audio { background: #007bff; width: 100%; text-align: center; margin-bottom: 10px; }
        .dl-audio:hover { background: #0056b3; }
        .error { color: #ff5555; margin-top: 15px; font-size: 0.95rem; }
        .loader { display: none; margin-top: 15px; color: #ff9999; font-style: italic; }
    </style>
</head>
<body>

<div class="card">
    <h2>YouTube MP4 & MP3 Downloader</h2>
    <div class="input-group">
        <input type="text" id="ytUrl" placeholder="Paste YouTube link here...">
        <button onclick="processVideo()">Extract Media</button>
    </div>

    <div id="loader" class="loader">Extracting media links from Render backend...</div>
    <div id="error" class="error"></div>

    <div id="results">
        <h3 id="videoTitle"></h3>
        <img id="videoThumb" src="" alt="Thumbnail">
        
        <div class="section-title">Audio Format</div>
        <div id="audioButtons" class="dl-container"></div>

        <div class="section-title">Video Formats</div>
        <div id="videoButtons" class="dl-container"></div>
    </div>
</div>

<script>
const BACKEND_URL = "https://yt-video-downloader-1-uzr6.onrender.com/api/extract";
let currentVideoTitle = "video";

async function processVideo() {
    const url = document.getElementById('ytUrl').value.trim();
    const errorDiv = document.getElementById('error');
    const loaderDiv = document.getElementById('loader');
    const resultsDiv = document.getElementById('results');
    const videoButtons = document.getElementById('videoButtons');
    const audioButtons = document.getElementById('audioButtons');

    errorDiv.innerText = '';
    resultsDiv.style.display = 'none';

    if (!url) {
        errorDiv.innerText = 'Please enter a YouTube link.';
        return;
    }

    loaderDiv.style.display = 'block';
    loaderDiv.innerText = 'Waking up backend server (this may take 30-40 seconds on first load)...';

    // Retry loop up to 3 times (gives Render up to 45s to wake up)
    let maxRetries = 3;
    let attempt = 0;
    let success = false;
    let data = null;

    while (attempt < maxRetries && !success) {
        try {
            attempt++;
            if (attempt > 1) {
                loaderDiv.innerText = `Server is warming up... Retrying (${attempt}/${maxRetries})...`;
            }

            // Set a generous timeout controller for 45 seconds
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 45000);

            const response = await fetch(BACKEND_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url }),
                signal: controller.signal
            });

            clearTimeout(timeoutId);

            if (response.ok) {
                data = await response.json();
                success = true;
            }
        } catch (err) {
            console.warn(`Attempt ${attempt} failed. Retrying...`);
            // Wait 3 seconds before trying again
            await new Promise(res => setTimeout(res, 3000));
        }
    }

    loaderDiv.style.display = 'none';

    if (!success || !data) {
        errorDiv.innerText = 'Server startup timed out or server is unreachable. Please refresh and try again in 10 seconds.';
        return;
    }

    if (data.error) {
        errorDiv.innerText = data.error;
        return;
    }

    // Render results
    currentVideoTitle = (data.title || "video").replace(/[^a-zA-Z0-9 _-]/g, "");
    document.getElementById('videoTitle').innerText = data.title;
    document.getElementById('videoThumb').src = data.thumbnail;

    // Render Audio Link
    audioButtons.innerHTML = '';
    if (data.audio_format) {
        const btn = document.createElement('button');
        btn.className = "dl-btn dl-audio";
        btn.innerText = `🎵 Download Audio (${data.audio_format.quality})`;
        btn.onclick = () => triggerDownload(data.audio_format.url, `${currentVideoTitle}.mp3`);
        audioButtons.appendChild(btn);
    } else {
        audioButtons.innerText = "No separate audio stream found.";
    }

    // Render Video Links
    videoButtons.innerHTML = '';
    if (data.video_formats && data.video_formats.length > 0) {
        data.video_formats.forEach(f => {
            const btn = document.createElement('button');
            btn.className = "dl-btn";
            btn.innerText = `🎬 ${f.quality} (${f.ext.toUpperCase()})`;
            btn.onclick = () => triggerDownload(f.url, `${currentVideoTitle}_${f.quality}.${f.ext}`);
            videoButtons.appendChild(btn);
        });
    } else {
        videoButtons.innerText = "No video formats available.";
    }

    resultsDiv.style.display = 'block';
}

// Forces media stream download in the browser instead of opening a web tab
function triggerDownload(streamUrl, filename) {
    const a = document.createElement('a');
    a.href = streamUrl;
    a.download = filename;
    a.target = "_blank";
    a.rel = "noreferrer";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}
</script>

</body>
</html>
